name: Nix Flake Check

# Forgejo port of .github/workflows/check.yml: check every host, then advance
# the auto-update branch and ping ntfy.
#
# While this repo is still a pull mirror of GitHub, the checks run but the
# push and ping are skipped (see .forgejo/scripts/is-mirror.sh): GitHub CI
# owns auto-update and notify.yml sends the ping. Converting the repo to a
# regular repository makes this the gate with no further commit.
#
# The ping has to live here, not in notify.yml: pushes made with the Actions
# token don't trigger other workflows, so notify.yml would never see this
# job's push to auto-update.

on:
  pull_request:
    paths:
      - "**.nix"
      - "**.age"
      # Blueprints and other data files are part of a host's configuration, but
      # they are not .nix, so a change to one used to reach main without ever
      # running check-hosts -- which meant the auto-update branch never advanced
      # and the change simply never deployed. Found when the authentik blueprint
      # fix in e6933a4 sat on main doing nothing.
      - "nixos/**/*.yaml"
      - "nixos/**/*.yml"
      - "nixos/**/*.py"
      - "nixos/**/*.cjs"
      - ".forgejo/workflows/check.yml"
      - ".forgejo/scripts/**"
      - "flake.lock"
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "**.age"
      - "nixos/**/*.yaml"
      - "nixos/**/*.yml"
      - "nixos/**/*.py"
      - "nixos/**/*.cjs"
      - ".forgejo/workflows/check.yml"
      - ".forgejo/scripts/**"
      - "flake.lock"
  workflow_dispatch:

jobs:
  check-hosts:
    runs-on: docker
    container:
      image: nixos/nix:latest
    timeout-minutes: 180
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
    steps:
      # No actions/checkout: the nixos/nix image has no node. The repo is
      # public, so a plain shallow fetch of the triggering commit is enough.
      - name: Checkout
        run: |
          git init -q .
          git fetch -q --depth 1 "${{ forgejo.server_url }}/${{ forgejo.repository }}.git" "${{ forgejo.sha }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
      - name: Check hosts
        run: .forgejo/scripts/check-hosts.sh

  check-peertube:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PeerTube provisioning and role mapping
        run: |
          python3 -m unittest discover -s test -p test_peertube_provision.py
          node test/peertube_oidc_role_sync.test.cjs

  auto-update:
    runs-on: docker
    timeout-minutes: 5
    needs: [check-hosts, check-peertube]
    if: forgejo.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether this repo is still a mirror
        id: mirror
        run: echo "mirror=$(.forgejo/scripts/is-mirror.sh '${{ forgejo.server_url }}' '${{ forgejo.repository }}')" >> "$GITHUB_OUTPUT"
      - name: Update auto-update branch
        if: steps.mirror.outputs.mirror == 'false'
        run: |
          git checkout -b auto-update && git reset --hard origin/main && git push origin auto-update -f || {
            echo "Failed to update auto-update branch"
            exit 1
          }
      - name: Send notification
        if: steps.mirror.outputs.mirror == 'false'
        run: |
          curl -fsS -d "Forgejo Actions Update" "https://ntfy.sh/${{ secrets.NTFY_UPDATE_TOPIC }}" || {
            echo "Failed to send notification"
            exit 1
          }
