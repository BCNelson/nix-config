name: Nix Flake Check

# The deploy gate: check every host, then advance the auto-update branch
# (which every auto-updating host builds) and ping ntfy to wake them. The push
# mirror carries auto-update on to GitHub, where hosts that haven't switched to
# Forgejo yet pick it up.
#
# The ping has to be a step here rather than a workflow triggered by the push:
# pushes made with the Actions token don't trigger other workflows.

on:
  pull_request:
    paths:
      - "**.nix"
      - "**.age"
      # Blueprints and other data files are part of a host's configuration, but
      # they are not .nix, so a change to one used to reach main without ever
      # running check-hosts -- which meant the auto-update branch never advanced
      # and the change simply never deployed. Found when the authentik blueprint
      # fix in e6933a4 sat on main doing nothing.
      - "nixos/**/*.yaml"
      - "nixos/**/*.yml"
      - "nixos/**/*.py"
      - "nixos/**/*.cjs"
      - "nixos/**/*.sh"
      - ".forgejo/workflows/check.yml"
      - ".forgejo/scripts/**"
      - "flake.lock"
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "**.age"
      - "nixos/**/*.yaml"
      - "nixos/**/*.yml"
      - "nixos/**/*.py"
      - "nixos/**/*.cjs"
      - "nixos/**/*.sh"
      - ".forgejo/workflows/check.yml"
      - ".forgejo/scripts/**"
      - "flake.lock"
  workflow_dispatch:

jobs:
  check-hosts:
    runs-on: docker
    container:
      image: nixos/nix:latest
    timeout-minutes: 180
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
    steps:
      # No actions/checkout: the nixos/nix image has no node. The repo is
      # public, so a plain shallow fetch of the triggering commit is enough.
      - name: Checkout
        run: |
          git init -q .
          git fetch -q --depth 1 "${{ forgejo.server_url }}/${{ forgejo.repository }}.git" "${{ forgejo.sha }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
      - name: Check hosts
        run: .forgejo/scripts/check-hosts.sh

  check-scripts:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check auto-update only moves forward
        run: .forgejo/scripts/test-advance-auto-update.sh
      - name: Check PeerTube provisioning and role mapping
        run: |
          python3 -m unittest discover -s test -p test_peertube_provision.py
          node test/peertube_oidc_role_sync.test.cjs

  auto-update:
    runs-on: docker
    timeout-minutes: 5
    needs: [check-hosts, check-scripts]
    if: forgejo.ref == 'refs/heads/main'

    steps:
      # Only the script is needed from the checkout; it does its own
      # commits-only fetch to compare ancestry.
      - uses: actions/checkout@v4
      # Advance auto-update to the commit check-hosts just checked, not to
      # whatever main is now: a push that lands mid-check would otherwise
      # deploy unchecked. Forward only -- runs are not serialised, so an older
      # commit's run can finish last; the script turns that into a no-op
      # instead of rolling every host back.
      - name: Advance auto-update branch
        id: advance
        env:
          TOKEN: ${{ forgejo.token }}
        run: |
          remote="${{ forgejo.server_url }}/${{ forgejo.repository }}.git"
          REMOTE="${remote/:\/\//://forgejo-actions:$TOKEN@}" \
            .forgejo/scripts/advance-auto-update.sh "${{ forgejo.sha }}"
      - name: Send notification
        if: steps.advance.outputs.advanced == 'true'
        run: |
          curl -fsS -d "Forgejo Actions Update" "https://ntfy.sh/${{ secrets.NTFY_UPDATE_TOPIC }}" || {
            echo "Failed to send notification"
            exit 1
          }
