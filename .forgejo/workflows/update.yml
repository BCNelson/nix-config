name: Bump flake.lock

# Daily flake bump: update flake.lock, check every host against it, then
# commit to main, advance auto-update and ping ntfy. A failed bump just fails
# the run; it is retried the next day.
#
# It has to advance auto-update itself: pushes made with the Actions token
# don't trigger other workflows, so check.yml never sees this commit.

concurrency:
  group: ${{ forgejo.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: docker
    container:
      image: nixos/nix:latest
    timeout-minutes: 180
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
    steps:
      - name: Checkout
        run: |
          git init -q .
          git fetch -q --depth 1 "${{ forgejo.server_url }}/${{ forgejo.repository }}.git" main
          git checkout -q -B main FETCH_HEAD
          git log --oneline -1

      - name: Update flake.lock
        id: lock
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check hosts
        if: steps.lock.outputs.changed == 'true'
        run: .forgejo/scripts/check-hosts.sh

      # The main push is a plain fast-forward; auto-update goes through the
      # same forward-only script check.yml uses, so a bump can never roll
      # hosts back past a commit check.yml has already shipped.
      - name: Commit and advance auto-update branch
        id: advance
        if: steps.lock.outputs.changed == 'true'
        env:
          TOKEN: ${{ forgejo.token }}
        run: |
          remote="${{ forgejo.server_url }}/${{ forgejo.repository }}.git"
          remote="${remote/:\/\//://forgejo-actions:$TOKEN@}"
          git -c user.name="Flake Bot" -c user.email="actions@git.bcnelson.dev" \
            commit --no-verify --signoff -m "Bump flake.lock" -- flake.lock
          git push "$remote" HEAD:main || {
            echo "Failed to push flake.lock bump"
            exit 1
          }
          REMOTE="$remote" .forgejo/scripts/advance-auto-update.sh "$(git rev-parse HEAD)"

      - name: Send notification
        if: steps.advance.outputs.advanced == 'true'
        run: |
          curl -fsS -d "Forgejo Actions Update" "https://ntfy.sh/${{ secrets.NTFY_UPDATE_TOPIC }}" || {
            echo "Failed to send notification"
            exit 1
          }
