[package]
name = "spool-core"
description = "Spool item model, ingest policy, SQLite/SQLCipher store and config (no Wayland)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
blake3 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
spool-crypto = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

# Criterion benches (`cargo bench -p spool-core`). Plain `cargo test` does not
# build bench targets, so the Nix check phase is unaffected.
[[bench]]
name = "policy"
harness = false

[[bench]]
name = "store"
harness = false
