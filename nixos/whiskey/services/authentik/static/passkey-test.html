<!DOCTYPE html>
<!--
  Temporary diagnostic (2026-11-05): does the browser's passkey provider
  (Bitwarden in Firefox) offer an auth.nel.family passkey through conditional
  mediation on a plain light-DOM field? authentik's real field lives in a
  shadow root, so this separates "the provider can't do conditional UI here"
  from "the provider can't see authentik's field". Logs nobody in: the
  challenge is random and the assertion is only displayed, never sent.
  Served by nginx at /custom-static/ (same origin, so rpId auth.nel.family
  is valid). Delete once the passkey question is settled.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passkey autofill test</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  input { font: inherit; padding: .5rem; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: .5rem 1rem; margin-top: 1rem; }
  pre { background: #f3f3f3; padding: 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Passkey autofill test</h1>
<p>Click the field below. If a passkey for auth.nel.family is offered in its
dropdown, autofill works on a plain field.</p>
<form onsubmit="return false">
  <input id="user" name="username" autocomplete="username webauthn" placeholder="Username">
</form>
<button id="modal">Test pop-up passkey request</button>
<pre id="log"></pre>
<script>
  const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
  const opts = () => ({
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rpId: "auth.nel.family",
    userVerification: "required",
    allowCredentials: [],
    timeout: 120000,
  });
  const show = (how, cred) => log(cred
    ? how + ": got a passkey (credential id " + cred.id.slice(0, 16) + "...). The browser/provider answered."
    : how + ": no credential returned.");

  // Only one WebAuthn request may be pending; the pop-up test aborts this one.
  const conditional = new AbortController();
  log("userAgent: " + navigator.userAgent);
  (async () => {
    const avail = window.PublicKeyCredential && PublicKeyCredential.isConditionalMediationAvailable
      ? await PublicKeyCredential.isConditionalMediationAvailable() : "API missing";
    log("isConditionalMediationAvailable: " + avail);
    if (avail !== true) return;
    log("conditional request started; click the field.");
    try {
      show("autofill", await navigator.credentials.get({ mediation: "conditional", publicKey: opts(), signal: conditional.signal }));
    } catch (e) { log("autofill error: " + e.name + ": " + e.message); }
  })();

  document.getElementById("modal").onclick = async () => {
    conditional.abort();
    log("pop-up request started (autofill request cancelled).");
    try {
      show("pop-up", await navigator.credentials.get({ publicKey: opts() }));
    } catch (e) { log("pop-up error: " + e.name + ": " + e.message); }
  };
</script>
</body>
</html>
