version: 1
metadata:
  name: opengym
entries:
  # OAuth2 / OIDC provider
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-opengym
    identifiers:
      name: opengym
    attrs:
      name: opengym
      client_type: confidential
      client_id: opengym
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow with
      # "Invalid grant_type for provider" -> "request is otherwise malformed".
      grant_types:
        - authorization_code
        - refresh_token
      # Injected from the systemd EnvironmentFile (see authentik.nix).
      client_secret: !Env OPENGYM_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # openGym keys its profiles on `sub` and nothing else, so the subject has
      # to outlive anything a person can change about themselves. user_uuid is
      # the only mode here that does — user_username breaks the moment somebody
      # is renamed, and they would come back as a brand-new profile with no
      # workout history. (gotosocial uses user_username only because it was
      # migrated off kanidm and had to match the subjects kanidm had issued.)
      sub_mode: user_uuid
      # RSA self-signed cert => RS256 ID tokens (default cert).
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://gym.nel.family/api/oidc/callback
      # groups are delivered via the default "profile" scope claim, which is
      # what OIDC_ADMIN_GROUPS=service_admins on the openGym side reads.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application (dashboard tile + access policy target)
  - model: authentik_core.application
    id: app-opengym
    identifiers:
      slug: opengym
    attrs:
      name: openGym
      slug: opengym
      provider: !KeyOf provider-opengym
      meta_launch_url: https://gym.nel.family/
      policy_engine_mode: any

  # Access restricted to household + extended_family. openGym has no access
  # control of its own beyond "has a profile", and it auto-provisions on first
  # sign-in, so these bindings are the only gate — anyone authentik lets through
  # gets an account.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-opengym
      group: !Find [authentik_core.group, [name, household]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-opengym
      group: !Find [authentik_core.group, [name, extended_family]]
      order: 1
    attrs:
      enabled: true
