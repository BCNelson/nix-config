version: 1
metadata:
  name: mealie
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-mealie
    identifiers:
      name: mealie
    attrs:
      name: mealie
      client_type: confidential
      client_id: mealie
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      # Injected from the systemd EnvironmentFile (see authentik.nix).
      client_secret: !Env MEALIE_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Mealie finds its users by the email claim (OIDC_USER_CLAIM), not by
      # sub, so the subject only has to be stable.
      sub_mode: user_uuid
      # RSA self-signed cert => RS256 (mealie.nix sets OIDC_SIGNING_ALGORITHM).
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://recipes.nel.family/login
      # profile carries the `groups` claim Mealie reads OIDC_ADMIN_GROUP from.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: app-mealie
    identifiers:
      slug: mealie
    attrs:
      name: Mealie
      slug: mealie
      provider: !KeyOf provider-mealie
      meta_launch_url: https://recipes.nel.family/
      policy_engine_mode: any

  # Mealie signs up anyone authentik lets through (OIDC_SIGNUP_ENABLED), so
  # these bindings are the access gate. Same groups kanidm's scope maps allowed.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-mealie
      group: !Find [authentik_core.group, [name, household]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-mealie
      group: !Find [authentik_core.group, [name, extended_family]]
      order: 1
    attrs:
      enabled: true
