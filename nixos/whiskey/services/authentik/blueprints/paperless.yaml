version: 1
metadata:
  name: paperless
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-paperless
    identifiers:
      name: paperless
    attrs:
      name: paperless
      client_type: confidential
      client_id: paperless
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      # Injected from the systemd EnvironmentFile (see authentik.nix).
      client_secret: !Env PAPERLESS_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # django-allauth links a social account by (provider_id, sub), so this
      # must never change once accounts are connected.
      sub_mode: user_uuid
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # allauth's callback is /accounts/oidc/<provider_id>/login/callback/;
      # provider_id is set in romeo's paperless.nix.
      redirect_uris:
        - matching_mode: strict
          url: https://docs.h.b.nel.family/accounts/oidc/authentik/login/callback/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: app-paperless
    identifiers:
      slug: paperless
    attrs:
      name: Paperless
      slug: paperless
      provider: !KeyOf provider-paperless
      meta_launch_url: https://docs.h.b.nel.family/
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-paperless
      group: !Find [authentik_core.group, [name, service_admins]]
      order: 0
    attrs:
      enabled: true
