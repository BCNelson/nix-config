version: 1
metadata:
  name: immich
entries:
  # Immich keeps its side of the OIDC config in its own database (Administration
  # -> Settings -> OAuth), not in Nix: issuer
  # https://auth.nel.family/application/o/immich/, client "immich", signing
  # algorithm RS256 (the self-signed key below is RSA), and the client secret
  # from secrets/store/shared/immich_auth_client_secret.age.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-immich
    identifiers:
      name: immich
    attrs:
      name: immich
      client_type: confidential
      client_id: immich
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      # Injected from the systemd EnvironmentFile (see authentik.nix).
      client_secret: !Env IMMICH_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Immich stores sub as the user's oauthId and looks users up by it first,
      # then by email (linking only users with no oauthId yet). user_uuid
      # survives a username rename.
      sub_mode: user_uuid
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Web login, linking from user settings, and the mobile app's custom
      # scheme (current apps use app.immich:///oauth-callback; older ones the
      # bare scheme, which kanidm had registered).
      redirect_uris:
        - matching_mode: strict
          url: https://photos.h.b.nel.family/auth/login
        - matching_mode: strict
          url: https://photos.h.b.nel.family/user-settings
        - matching_mode: strict
          url: app.immich:///oauth-callback
        - matching_mode: strict
          url: app.immich://
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: app-immich
    identifiers:
      slug: immich
    attrs:
      name: Immich
      slug: immich
      provider: !KeyOf provider-immich
      meta_launch_url: https://photos.h.b.nel.family/
      policy_engine_mode: any

  # Immich auto-registers anyone authentik lets through, so this binding is the
  # access gate. Same group kanidm's scope map allowed.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-immich
      group: !Find [authentik_core.group, [name, household]]
      order: 0
    attrs:
      enabled: true
