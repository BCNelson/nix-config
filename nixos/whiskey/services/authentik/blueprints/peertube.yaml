version: 1
metadata:
  name: peertube
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: scope-peertube-role
    identifiers:
      name: PeerTube service administrator role
    attrs:
      name: PeerTube service administrator role
      scope_name: peertube
      description: PeerTube role from service_admins membership
      expression: |
        return {
            "peertube_role": 0 if request.user.ak_groups.filter(name="service_admins").exists() else 2
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-peertube
    identifiers:
      name: peertube
    attrs:
      name: peertube
      client_type: confidential
      client_id: peertube
      client_secret: !Env PEERTUBE_OAUTH_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: user_uuid
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://tube.nel.family/plugins/auth-openid-connect/router/code-cb
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-peertube-role

  - model: authentik_core.application
    id: app-peertube
    identifiers:
      slug: peertube
    attrs:
      name: PeerTube
      slug: peertube
      provider: !KeyOf provider-peertube
      meta_launch_url: https://tube.nel.family/
      policy_engine_mode: any

  # Family members can sign in; service administrators can also sign in without
  # family-group membership. The dedicated scope grants only them role 0.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-peertube
      group: !Find [authentik_core.group, [name, household]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-peertube
      group: !Find [authentik_core.group, [name, service_admins]]
      order: 2
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-peertube
      group: !Find [authentik_core.group, [name, extended_family]]
      order: 1
    attrs:
      enabled: true
