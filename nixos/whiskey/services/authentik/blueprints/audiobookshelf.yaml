version: 1
metadata:
  name: audiobookshelf
entries:
  # OAuth2 / OIDC provider. Audiobookshelf keeps its side of the OIDC config in
  # its own database (Settings -> Authentication), not in Nix: the issuer there
  # is https://auth.nel.family/application/o/audiobookshelf/ and the signing
  # algorithm must be RS256 (the self-signed key below is RSA).
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-audiobookshelf
    identifiers:
      name: audiobookshelf
    attrs:
      name: audiobookshelf
      client_type: confidential
      client_id: audiobookshelf
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow with
      # "Invalid grant_type for provider" -> "request is otherwise malformed".
      grant_types:
        - authorization_code
        - refresh_token
      # Injected from the systemd EnvironmentFile (see authentik.nix).
      client_secret: !Env AUDIOBOOKSHELF_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Audiobookshelf stores `sub` on the user (extraData.authOpenIDSub) and
      # looks users up by it before anything else. user_uuid survives a
      # username rename, so a renamed user keeps their listening progress.
      sub_mode: user_uuid
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # The web flow returns to /callback; the mobile apps go through
      # /mobile-redirect, which bounces on to the app's own audiobookshelf://
      # URI (that last hop is checked by Audiobookshelf, not by authentik).
      redirect_uris:
        - matching_mode: strict
          url: https://audiobooks.nel.family/auth/openid/callback
        - matching_mode: strict
          url: https://audiobooks.nel.family/auth/openid/mobile-redirect
      # Audiobookshelf requests "openid profile email" and matches existing
      # accounts on preferred_username (profile scope).
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application (dashboard tile + access policy target)
  - model: authentik_core.application
    id: app-audiobookshelf
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobookshelf
      slug: audiobookshelf
      provider: !KeyOf provider-audiobookshelf
      meta_launch_url: https://audiobooks.nel.family/
      policy_engine_mode: any

  # Audiobookshelf auto-registers anyone authentik lets through, so these
  # bindings are the only access gate. Same groups kanidm's scope maps allowed.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-audiobookshelf
      group: !Find [authentik_core.group, [name, household]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-audiobookshelf
      group: !Find [authentik_core.group, [name, extended_family]]
      order: 1
    attrs:
      enabled: true
