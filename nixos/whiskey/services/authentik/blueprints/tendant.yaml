version: 1
metadata:
  name: tendant
entries:
  # OAuth2 / OIDC provider
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-tendant
    identifiers:
      name: tendant
    attrs:
      name: tendant
      client_type: confidential
      client_id: tendant
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow with
      # "Invalid grant_type for provider" -> "request is otherwise malformed".
      grant_types:
        - authorization_code
        - refresh_token
      # Injected from the systemd EnvironmentFile (see authentik.nix).
      client_secret: !Env TENDANT_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Stable across renames; tendant admits by group, but if it is ever
      # switched to allowed_subjects the subject must not change under it.
      sub_mode: user_uuid
      # RSA self-signed cert => RS256 ID tokens (default cert).
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Desktop apps use a 127.0.0.1 loopback and the web app a same-page
      # redirect; this is the only URI tendant needs registered.
      redirect_uris:
        - matching_mode: strict
          url: https://tendant.nel.family/auth/oidc/callback
      # groups ride in the default "profile" scope claim, which is what
      # tendant's auth.oidc.allowed_group = service_admins reads.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # Application (dashboard tile + access policy target)
  - model: authentik_core.application
    id: app-tendant
    identifiers:
      slug: tendant
    attrs:
      name: tendant
      slug: tendant
      provider: !KeyOf provider-tendant
      meta_launch_url: https://tendant.nel.family/
      policy_engine_mode: any

  # tendant has one person, the owner: anyone it admits signs in AS the owner.
  # So only service_admins, both here and in tendant's allowed_group.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-tendant
      group: !Find [authentik_core.group, [name, service_admins]]
      order: 0
    attrs:
      enabled: true
