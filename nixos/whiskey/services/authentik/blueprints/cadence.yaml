version: 1
metadata:
  name: cadence
entries:
  # Cadence's SPA runs auth-code + PKCE in the browser as a public client and
  # sends the ID token as a Bearer token; the server only checks issuer,
  # signature and audience (= client_id). It grants every valid token the
  # configured tier, so the binding below is the only access gate.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-cadence
    identifiers:
      name: cadence
    attrs:
      name: cadence
      client_type: public
      client_id: cadence
      # Authentik 2026.x requires grant_types to be set explicitly; the model
      # default is an empty list, which rejects the auth-code flow as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: user_uuid
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Also the silent-renew target: oidc-client-ts reuses redirect_uri.
      redirect_uris:
        - matching_mode: strict
          url: https://health.b.nel.family/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: app-cadence
    identifiers:
      slug: cadence
    attrs:
      name: Cadence
      slug: cadence
      provider: !KeyOf provider-cadence
      meta_launch_url: https://health.b.nel.family/
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-cadence
      group: !Find [authentik_core.group, [name, service_admins]]
      order: 0
    attrs:
      enabled: true
