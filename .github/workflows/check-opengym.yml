name: Check openGym

# Runs ONLY when openGym's own code changes: the packages, the OIDC patch, the
# NixOS module or the VM test. Deliberately NOT triggered on flake.lock, so
# routine nixpkgs bumps don't re-run a ~15 minute VM test that has nothing to
# say about them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    # Duplicated below rather than shared with a YAML anchor: the Actions
    # workflow parser does not support anchors or aliases.
    paths:
      - "pkgs/opengym/**"
      - "modules/nixos/opengym.nix"
      - "nixos/romeo/services/opengym.nix"
      - ".github/workflows/check-opengym.yml"
  push:
    branches:
      - "main"
    paths:
      - "pkgs/opengym/**"
      - "modules/nixos/opengym.nix"
      - "nixos/romeo/services/opengym.nix"
      - ".github/workflows/check-opengym.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      # Proves ./oidc.patch still applies and that both halves still build. The
      # frontend build is also where a bad patch to Login.jsx or the locale packs
      # surfaces, since vite fails on a broken import.
      - name: Build openGym packages
        run: nix build .#opengym-api .#opengym-web -L --show-trace

  vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      # End-to-end: a real OIDC sign-in against a stub provider that checks PKCE
      # and the client secret, a real passkey registration and assertion, the
      # systemd hardening score, and the nginx header scrubbing. Fully hermetic —
      # no identity provider outside the VM is contacted.
      - name: Run openGym VM test
        run: nix build .#opengym-test -L --show-trace
