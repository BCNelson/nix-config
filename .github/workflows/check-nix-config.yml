name: Check NixOS Configuration

on:
  workflow_call:
    inputs:
      updated_flake:
        description: 'Whether to use updated flake.lock'
        required: false
        type: boolean
        default: false

jobs:
  get-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Remove existing flake.lock
        if: ${{ inputs.updated_flake }}
        run: rm -f flake.lock
      - name: Download updated flake.lock
        if: ${{ inputs.updated_flake }}
        uses: actions/download-artifact@v4
        with:
          name: flake.lock
      - id: set-hosts
        run: echo "hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)" >> $GITHUB_OUTPUT

  check-hosts:
    needs: get-hosts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        host: ${{ fromJson(needs.get-hosts.outputs.hosts) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
      actions: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - name: Download updated flake.lock
        if: ${{ inputs.updated_flake }}
        run: rm -f flake.lock
      - name: Download updated flake.lock
        if: ${{ inputs.updated_flake }}
        uses: actions/download-artifact@v4
        with:
          name: flake.lock
      - name: Check host ${{ matrix.host }}
        run: |
          for attempt in 1 2 3; do
            nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run --show-trace && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Host check failed (attempt ${attempt}/3), retrying in 20s..."
            sleep 20
          done

  check-devshell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - name: Download updated flake.lock
        if: ${{ inputs.updated_flake }}
        run: rm -f flake.lock
      - name: Download updated flake.lock
        if: ${{ inputs.updated_flake }}
        uses: actions/download-artifact@v4
        with:
          name: flake.lock
      - name: Check devshell
        run: nix build .#devShells.x86_64-linux.default --dry-run --show-trace